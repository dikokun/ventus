<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VENTUS — Stormwalker Dispatch</title>
<style>
  :root {
    --ink: #0a0f16; --glass: rgba(10, 16, 24, 0.78); --line: #2c3e50;
    --cyan: #37e0ff; --amber: #ffc861; --paper: #eef3f7; --dim: #8fa3b8;
    --green: #59d98c; --red: #ff5d5d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
  body { font-family: "Avenir Next", "Segoe UI", Inter, system-ui, sans-serif; color: var(--paper); }
  #scene { position: fixed; inset: 0; }
  canvas.webgl { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.flying #hud { display: block; }
  .tape {
    position: absolute; top: 84px; width: 92px; padding: 8px 0 6px; text-align: center;
    background: var(--glass); border: 1px solid var(--line); border-radius: 10px;
  }
  #tape-l { left: 18px; } #tape-r { right: 18px; }
  .tape .lab { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); }
  .tape .val { font-size: 30px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .tape .sub { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #hdg-wrap {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center;
    background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 5px 18px 7px;
  }
  #hdg-wrap .lab { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); }
  #hdg { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #tgt { display: block; font-size: 12.5px; color: var(--amber); margin-top: 1px; min-height: 15px; }
  #obj {
    position: absolute; top: 84px; left: 50%; transform: translateX(-50%); width: 340px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  }
  #obj-title { font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em; }
  #obj-sub { font-size: 12px; color: var(--dim); margin-top: 1px; min-height: 14px; }
  #obj-track { height: 5px; background: #1c2836; border-radius: 3px; margin-top: 6px; }
  #obj-bar { height: 100%; width: 0%; background: var(--cyan); border-radius: 3px; transition: width 0.2s; }
  #meters {
    position: absolute; left: 18px; bottom: 16px; width: 240px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  .mrow { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 10.5px; }
  .mrow:first-child { margin-top: 0; }
  .mrow .mlab { width: 58px; letter-spacing: 0.08em; color: var(--dim); }
  .mrow .mtxt { width: 74px; text-align: right; font-variant-numeric: tabular-nums; color: var(--paper); }
  .track { flex: 1; height: 8px; background: #1c2836; border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: var(--cyan); }
  #fuel-fill { background: var(--amber); } #hull-fill { background: var(--green); } #thr-fill { background: #aeb9c4; }
  #shear-txt { position: absolute; left: 18px; bottom: 138px; font-size: 15px; font-weight: 800; letter-spacing: 0.14em; }
  #warn {
    position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 800; letter-spacing: 0.1em; color: var(--red); text-align: center;
    text-shadow: 0 1px 8px #000; min-height: 20px;
  }
  #radio {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: 620px;
    background: var(--glass); border-left: 3px solid var(--amber); border-radius: 6px;
    padding: 8px 14px; font-size: 13.5px; font-style: italic; color: #ffe9bb; transition: opacity 0.6s;
  }
  #panel { position: absolute; right: 18px; bottom: 16px; border-radius: 14px; display: none; }
  body.cockpit #panel { display: block; }
  body.cockpit #radio { bottom: 190px; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 26px; color: rgba(55, 224, 255, 0.85); display: none; text-shadow: 0 0 6px #000;
  }
  body.armed #crosshair { display: block; }

  /* ---------- Screens ---------- */
  .screen { position: fixed; inset: 0; overflow-y: auto; display: none; }
  body.menu #hangar { display: block; }
  body.results #results { display: flex; align-items: center; justify-content: center; }
  #hangar { background: linear-gradient(180deg, rgba(7,11,18,0.9), rgba(10,17,26,0.94)); padding: 20px 26px 30px; }
  .hg-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .hg-title { font-size: 40px; font-weight: 900; letter-spacing: 0.12em; color: var(--paper); }
  .hg-title::after { content: " ⚡"; color: var(--cyan); }
  .hg-sub { color: var(--dim); font-size: 13.5px; letter-spacing: 0.04em; }
  .hg-chips { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: #16222f; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12px; }
  .chip.ok { color: var(--green); border-color: #24503a; }
  .hg-cols { display: grid; grid-template-columns: 300px 1fr 250px; gap: 18px; margin-top: 16px; align-items: start; }
  h3 { font-size: 12px; letter-spacing: 0.22em; color: var(--dim); margin-bottom: 10px; }
  .frame-card, .ct-card {
    background: #101a26; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  .frame-card.active { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan) inset; }
  .ct-card.locked { opacity: 0.55; }
  .fc-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .fc-name { font-weight: 800; font-size: 15px; }
  .fc-role { font-size: 11px; color: var(--dim); text-align: right; }
  .fc-blurb, .fc-brief { font-size: 12.5px; color: #c6d2dd; margin-top: 5px; line-height: 1.45; }
  .fc-disp { font-size: 11.5px; color: var(--dim); margin-top: 4px; }
  .fc-stats { display: flex; gap: 12px; font-size: 11.5px; color: var(--amber); margin-top: 7px; font-variant-numeric: tabular-nums; }
  .fc-ups { margin-top: 8px; border-top: 1px dashed #24344a; padding-top: 7px; }
  .up-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 4px; }
  .up-name { width: 74px; color: var(--dim); }
  .up-pips { color: var(--cyan); letter-spacing: 2px; flex: 1; }
  .ct-foot { display: flex; gap: 7px; align-items: center; margin-top: 9px; flex-wrap: wrap; }
  .btn {
    pointer-events: auto; cursor: pointer; background: #1b2a3c; color: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 13px; font-size: 12.5px; font-weight: 700;
    font-family: inherit;
  }
  .btn:hover:not(:disabled) { border-color: var(--cyan); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.fly { background: var(--cyan); color: #06222b; border-color: var(--cyan); margin-left: auto; padding: 7px 20px; }
  .btn.tiny { padding: 3px 9px; font-size: 11px; }
  .btn.danger { color: var(--red); margin-top: 12px; }
  .medal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .medal { font-size: 11.5px; padding: 6px 8px; border: 1px solid #223145; border-radius: 8px; color: var(--dim); }
  .medal.got { color: var(--amber); border-color: #6b5518; background: #1d1a10; }
  .hg-keys { font-size: 11.5px; color: var(--dim); margin-top: 14px; line-height: 1.6; }
  #results { background: rgba(5, 8, 12, 0.72); }
  .rs-box { background: #101a26; border: 1px solid var(--line); border-radius: 14px; padding: 26px 30px; width: 460px; }
  .rs-title { font-size: 24px; font-weight: 900; letter-spacing: 0.04em; }
  .rs-sub { color: var(--dim); margin-top: 3px; font-size: 13px; }
  .rs-slip { margin: 16px 0; border-top: 1px dashed #2c3e50; }
  .rs-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed #223145; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .rs-row.total { font-weight: 800; font-size: 15px; border-bottom: none; }
  .rs-rep { color: var(--cyan); font-size: 13px; margin-top: 6px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body class="menu">
<div id="scene"></div>

<div id="hud">
  <div id="hdg-wrap"><span class="lab">HDG</span> <span id="hdg">000</span><span id="tgt"></span></div>
  <div class="tape" id="tape-l"><div class="lab">SPD KT</div><div class="val" id="spd">0</div><div class="sub">VS <span id="vs">+0</span> FPM</div></div>
  <div class="tape" id="tape-r"><div class="lab">ALT FT</div><div class="val" id="alt">0</div><div class="sub">ENERGY <span id="energy">0</span></div></div>
  <div id="obj"><div id="obj-title"></div><div id="obj-sub"></div><div id="obj-track"><div id="obj-bar"></div></div></div>
  <div id="shear-txt"></div>
  <div id="meters">
    <div class="mrow"><span class="mlab">CAPACITOR</span><div class="track"><div class="fill" id="cap-fill"></div></div><span class="mtxt" id="cap-txt"></span></div>
    <div class="mrow"><span class="mlab">FUEL</span><div class="track"><div class="fill" id="fuel-fill"></div></div><span class="mtxt"></span></div>
    <div class="mrow"><span class="mlab">HULL</span><div class="track"><div class="fill" id="hull-fill"></div></div><span class="mtxt"></span></div>
    <div class="mrow"><span class="mlab">THROTTLE</span><div class="track"><div class="fill" id="thr-fill"></div></div><span class="mtxt"></span></div>
  </div>
  <div id="warn"></div>
  <div id="radio"></div>
  <canvas id="panel" width="540" height="150"></canvas>
  <div id="crosshair">◎</div>
</div>

<div id="hangar" class="screen"></div>
<div id="results" class="screen"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
